# Checks the Liiga functions against the real liiga.fi API every Monday,
# because the API is undocumented and can change without notice.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ["R/liiga_*.R", ".github/scripts/liiga-live.R", ".github/workflows/liiga-live.yaml"]

name: liiga-live

permissions: read-all

jobs:
  liiga-live:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          dependencies: '"hard"'

      - name: Run live check
        run: Rscript .github/scripts/liiga-live.R
